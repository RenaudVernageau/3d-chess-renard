<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"

    <title>Immersive Chess</title>

    <meta property="og:title" content="Immersive Chess – Jouez aux échecs en 3D" />

    <meta property="og:image" content="/social/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/social/og-image.jpg" />

    <!-- JSON-LD enrichi -->
    <script type="application/ld+json">

      "name": "Immersive Chess",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",

      "image": "https://immersive-chess.com/social/og-image.jpg",
      "author": {
        "@type": "Organization",
        "name": "Immersive Chess"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      }

    <div id="root"></div>
